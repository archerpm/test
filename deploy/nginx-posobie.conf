# Сайт «Помощник по мерам поддержки». Подставляется install-bundle.sh:
#   @LISTEN@ — порт (80 при указанном домене или свободный высокий порт без домена)
#   @SERVER_NAME@ — домен или _
# Файл НЕ объявляет default_server и не трогает другие сайты на этом сервере.
# Ограничение частоты запросов с одного адреса (защита от перебора и простого DoS); файл подключается внутри http{}
limit_req_zone $binary_remote_addr zone=posobie:2m rate=10r/s;

server {
    listen @LISTEN@;
    @LISTEN6@
    server_name @SERVER_NAME@;

    server_tokens off;
    limit_req zone=posobie burst=80 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 20s;
    keepalive_timeout 15s;
    # сайт статический: другие методы не нужны
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    root /var/www/posobie;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # страница и сервис-воркер всегда свежие, чтобы обновления доходили сразу
    location = /index.html { include /etc/nginx/snippets/posobie-headers.conf; add_header Cache-Control "no-cache" always; }
    location = /sw.js      { include /etc/nginx/snippets/posobie-headers.conf; add_header Cache-Control "no-cache" always; }
    location = /manifest.webmanifest { include /etc/nginx/snippets/posobie-headers.conf; default_type application/manifest+json; add_header Cache-Control "no-cache" always; }

    # файлы сборки с хэшем в имени — кэшируем на год
    location /assets/ {
        include /etc/nginx/snippets/posobie-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # отчёт еженедельной проверки ссылок (текст)
    location /status/ {
        include /etc/nginx/snippets/posobie-headers.conf;
        alias /var/www/posobie-status/;
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache" always;
        autoindex off;
    }

    location / {
        include /etc/nginx/snippets/posobie-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known/) { deny all; }   # скрытые файлы закрыты, кроме проверки Let's Encrypt
}
